name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Validate release version
        run: |
          python -c "import os,re,tomllib; from pathlib import Path; tag=os.environ['RELEASE_TAG']; version=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag) and tag=='v'+version, 'Tag must match the project version'"
      - name: Install and check
        run: |
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q dowidget run_widget.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name DoWidget --collect-data dowidget --icon dowidget/assets/dowidget.ico --hidden-import keyring.backends.Windows run_widget.py
      - name: Package complete application directory
        run: |
          $asset = "DoWidget-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path dist/DoWidget -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" "DoWidget-$env:RELEASE_TAG-windows-x64.zip" SHA256SUMS.txt --verify-tag --title "DoWidget $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
